version: '3.9'

services:
  open_case_backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: open_case_backend
    ports:
      - "${APP_PORT}:80"
    env_file:
      - ../.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.django.base
      - RABBITMQ_HOST=${RABBITMQ_DEFAULT_HOST}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASS=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - ../config:/opt/app/config
      - ../apps:/opt/app/apps
      - ../manage.py:/opt/app/manage.py
      - ../media:/media
      - ../logs:/logs
    networks:
      - backend
    restart: always
networks:
  backend:
    name: backend
    driver: bridge
