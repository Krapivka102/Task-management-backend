version: '3.9'

services:
  task_management_db_pg:
    env_file:
      - ../.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
    container_name: task_management_db_pg
    image: postgres:14
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata4:/var/lib/postgresql/data
    networks:
      - backend

volumes:
  pgdata4:

networks:
  backend:
    name: backend
    driver: bridge
