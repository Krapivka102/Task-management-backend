services:
  task_management_db_pg:
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
    container_name: task_management_db_pg
    image: postgres:16-alpine
    shm_size: 128mb
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

  task_management_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_management_backend
    ports:
      - "${APP_PORT}:80"
    env_file:
      - .env
    volumes:
      - ../logs:/logs
    depends_on:
      task_management_db_pg:
        condition: service_healthy
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: task_management_redis
    ports:
      - "6379:6379"
    networks:
      - backend
    depends_on:
      task_management_db_pg:
        condition: service_healthy
    restart: always

volumes:
  pgdata:

networks:
  backend:
    name: backend
    driver: bridge